<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ราคาน้ำมันวันนี้ — Oil Price Dashboard</title>
    <meta name="description"
        content="ติดตามราคาน้ำมันวันนี้ อัปเดตล่าสุดจากบางจาก ดีเซล แก๊สโซฮอล์ เบนซิน ราคาขายปลีก กทม.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Animated Background Orbs -->
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="app-container">

        <!-- Header -->
        <header class="header" id="header">

            <h1 class="header__title">ราคาน้ำมันวันนี้</h1>
            <p class="header__subtitle">ข้อมูลราคาน้ำมันขายปลีก อัปเดตอัตโนมัติจาก Bangchak</p>
        </header>

        <!-- Info Bar -->
        <div class="info-bar" id="info-bar">
            <!-- Populated by JS -->
        </div>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Loading State -->
            <div class="loading-container" id="loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">กำลังโหลดราคาน้ำมัน...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p class="footer__text">
                ข้อมูลจาก <a href="https://www.bangchak.co.th" target="_blank" rel="noopener noreferrer">Bangchak
                    Corporation PCL</a><br>
                ราคาขายปลีก กทม. ยังไม่รวมภาษีบำรุงท้องถิ่น
            </p>
        </footer>

    </div>

    <script>
        // ===== Configuration =====
        const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const API_URL = isLocal ? 'api.php' : '/api';

        // ===== SVG Icons =====
        const ICONS = {
            calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
            clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            arrowUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
            arrowDown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`,
            minus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
            info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        };

        // ===== Helpers =====
        function classifyOil(name) {
            const n = name.toLowerCase();
            if (n.includes('ดีเซล')) return 'diesel';
            if (n.includes('พรีเมียม') || n.includes('98')) return 'premium';
            return 'gasohol';
        }

        function getCategoryInfo(type) {
            const map = {
                diesel: { emoji: '🛢️', label: 'น้ำมันดีเซล', iconClass: 'diesel' },
                gasohol: { emoji: '⛽', label: 'แก๊สโซฮอล์', iconClass: 'gasohol' },
                premium: { emoji: '💎', label: 'พรีเมียม', iconClass: 'premium' },
            };
            return map[type] || map.gasohol;
        }

        function getPriceChangeHTML(diff) {
            if (diff > 0) {
                return `<span class="oil-card__price-change oil-card__price-change--up">${ICONS.arrowUp}+${diff.toFixed(2)}</span>`;
            } else if (diff < 0) {
                return `<span class="oil-card__price-change oil-card__price-change--down">${ICONS.arrowDown}${diff.toFixed(2)}</span>`;
            }
            return `<span class="oil-card__price-change oil-card__price-change--same">${ICONS.minus}ไม่เปลี่ยนแปลง</span>`;
        }

        function getBadgeHTML(diff) {
            if (diff > 0) {
                return `<div class="oil-card__badge oil-card__badge--up">${ICONS.arrowUp} ขึ้น ${diff.toFixed(2)}</div>`;
            } else if (diff < 0) {
                return `<div class="oil-card__badge oil-card__badge--down">${ICONS.arrowDown} ลง ${Math.abs(diff).toFixed(2)}</div>`;
            }
            return `<div class="oil-card__badge oil-card__badge--same">— คงเดิม</div>`;
        }

        // ===== Render Functions =====
        function renderInfoBar(data) {
            const infoBar = document.getElementById('info-bar');
            infoBar.innerHTML = `
                <div class="info-bar__chip info-bar__chip--live">
                    <span class="live-dot"></span>
                    <span>อัปเดตล่าสุด</span>
                </div>
                <div class="info-bar__chip">
                    ${ICONS.calendar}
                    <span>${data.OilPriceDate}</span>
                </div>
                <div class="info-bar__chip">
                    ${ICONS.clock}
                    <span>${data.OilPriceTime} น.</span>
                </div>
            `;
        }

        function renderOilCard(oil, index) {
            const type = classifyOil(oil.OilName);
            const diff = oil.PriceToday - oil.PriceYesterday;
            const iconUrl = oil.IconWeb2 || oil.IconWeb || oil.Icon;

            return `
                <article class="oil-card oil-card--${type}" style="animation-delay: ${0.1 + index * 0.05}s" id="oil-card-${index}">
                    <div class="oil-card__header">
                        <img class="oil-card__icon" src="${iconUrl}" alt="${oil.OilName}" loading="lazy" onerror="this.style.display='none'">
                        <div>
                            <div class="oil-card__name">${oil.OilName}</div>
                            ${getBadgeHTML(diff)}
                        </div>
                    </div>
                    <div class="oil-card__price-section">
                        <div class="oil-card__current-price">
                            ${oil.PriceToday.toFixed(2)}<span class="currency">บาท/ลิตร</span>
                        </div>
                        ${getPriceChangeHTML(diff)}
                    </div>
                    <div class="oil-card__details">
                        <div class="oil-card__detail">
                            <div class="oil-card__detail-label">ราคาเมื่อวาน</div>
                            <div class="oil-card__detail-value">${oil.PriceYesterday.toFixed(2)}</div>
                        </div>
                        <div class="oil-card__detail">
                            <div class="oil-card__detail-label">ราคาพรุ่งนี้</div>
                            <div class="oil-card__detail-value">${oil.PriceTomorrow.toFixed(2)}</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderOilSection(title, oilItems, type, startIndex) {
            const categoryInfo = getCategoryInfo(type);
            return `
                <div class="section-title">
                    <div class="section-title__icon section-title__icon--${categoryInfo.iconClass}">
                        ${categoryInfo.emoji}
                    </div>
                    <span class="section-title__text">${title}</span>
                    <span class="section-title__count">${oilItems.length} รายการ</span>
                </div>
                <div class="oil-grid">
                    ${oilItems.map((oil, i) => renderOilCard(oil, startIndex + i)).join('')}
                </div>
            `;
        }

        function renderContent(data) {
            const oilList = JSON.parse(data.OilList);
            const mainContent = document.getElementById('main-content');

            // Categorize oils
            const diesel = [];
            const gasohol = [];
            const premium = [];

            oilList.forEach(oil => {
                const type = classifyOil(oil.OilName);
                if (type === 'diesel') diesel.push(oil);
                else if (type === 'premium') premium.push(oil);
                else gasohol.push(oil);
            });

            let html = '';
            let idx = 0;

            if (diesel.length > 0) {
                html += renderOilSection('น้ำมันดีเซล', diesel, 'diesel', idx);
                idx += diesel.length;
            }

            if (gasohol.length > 0) {
                html += renderOilSection('แก๊สโซฮอล์', gasohol, 'gasohol', idx);
                idx += gasohol.length;
            }

            if (premium.length > 0) {
                html += renderOilSection('พรีเมียม', premium, 'premium', idx);
                idx += premium.length;
            }

            // Remark section
            if (data.OilRemark || data.OilRemark2) {
                html += `
                    <div class="remark-section">
                        <div class="remark-section__text">
                            ${data.OilRemark ? `${ICONS.info} ${data.OilRemark}<br>` : ''}
                            ${data.OilRemark2 ? `${ICONS.info} ${data.OilRemark2}` : ''}
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = html;
        }

        function renderError(message) {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="error-container" id="error-state">
                    <div class="error-container__icon">⚠️</div>
                    <h2 class="error-container__title">ไม่สามารถโหลดข้อมูลได้</h2>
                    <p class="error-container__message">${message || 'เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์ กรุณาลองใหม่อีกครั้ง'}</p>
                    <button class="error-container__retry" onclick="fetchOilPrices()" id="retry-button">
                        ลองใหม่อีกครั้ง
                    </button>
                </div>
            `;
        }

        // ===== API Fetch =====
        async function fetchOilPrices() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="loading-container" id="loading">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">กำลังโหลดราคาน้ำมัน...</p>
                </div>
            `;

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const json = await response.json();
                const data = Array.isArray(json) ? json[0] : json;

                if (!data || !data.OilList) {
                    throw new Error('ข้อมูลไม่ถูกต้อง');
                }

                renderInfoBar(data);
                renderContent(data);

            } catch (error) {
                console.error('Error fetching oil prices:', error);
                renderError(error.message);
            }
        }

        // ===== Initialize =====
        document.addEventListener('DOMContentLoaded', fetchOilPrices);
    </script>

</body>

</html>
